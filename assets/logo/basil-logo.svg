<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="360" height="72" role="img" aria-label="BASIL - Biomarkers and Stable Isotope Laboratory">
  <title>BASIL - Biomarkers and Stable Isotope Laboratory</title>
  <!--
    Horizontal lockup: mark + wordmark. Use this one on letterheads,
    posters and slide decks. For a favicon or avatar use basil-mark.svg.

    The wordmark is drawn as text in Source Serif 4 with a system serif
    fallback, so it still renders if the font is unavailable.
  -->
  <g transform="translate(4 4)">
    <g clip-path="url(#basil-leaf-clip-2)">
      <rect x="0" y="40" width="64" height="2.4" fill="#96341F" opacity=".28"/>
      <rect x="0" y="46" width="64" height="2.4" fill="#96341F" opacity=".18"/>
    </g>
    <defs>
      <clipPath id="basil-leaf-clip-2">
        <path d="M32 4C43 16 52 28 52 38a20 20 0 0 1-40 0C12 28 21 16 32 4Z"/>
      </clipPath>
    </defs>
    <path d="M32 4C43 16 52 28 52 38a20 20 0 0 1-40 0C12 28 21 16 32 4Z"
          fill="none" stroke="#96341F" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M32 12v46" stroke="#96341F" stroke-width="2.4" stroke-linecap="round" opacity=".5"/>
    <path d="M32 28.5 40.5 33.4v9.7L32 48l-8.5-4.9v-9.7Z"
          fill="#FFFFFF" stroke="#96341F" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <text x="86" y="34"
        font-family="'Source Serif 4', Georgia, 'Times New Roman', serif"
        font-size="30" font-weight="700" letter-spacing="3" fill="#23180F">BASIL</text>

  <text x="88" y="52"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="10.5" font-weight="500" letter-spacing="0.6" fill="#5C6E74">Biomarkers &amp; Stable Isotope Laboratory</text>

  <text x="88" y="65"
        font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="9" font-weight="400" letter-spacing="0.5" fill="#5C6E74">IIT (ISM) Dhanbad</text>
</svg>
